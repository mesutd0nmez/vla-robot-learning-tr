<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>VLA Tez Günlüğü</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Learning ve VLA — yüksek lisans tez günlüğü (Türkçe)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css?v=5">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'VLA Tez Günlüğü',
      repo: '',
      homepage: 'home.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      relativePath: true,
      auto2top: true,
      notFoundPage: true,
      requestHeaders: { 'cache-control': 'no-cache' },
      search: { placeholder: 'Derslerde ara', noData: 'Sonuç yok', paths: 'auto', depth: 3 },
      copyCode: { buttonText: 'Kopyala', successText: 'Kopyalandı', errorText: 'Hata' },
      pagination: { previousText: 'Önceki', nextText: 'Sonraki', crossChapter: true, crossChapterText: true },
      plugins: [
        function (hook, vm) {
          // 0) Kenar çubuğu: açılır-kapanır gruplar. Açık/kapalı tercih localStorage'da;
          //    içinde bulunulan sayfanın grubu her gezinmede kendiliğinden açılır.
          var NAV_KEY = 'vla-nav-v1';
          function navState() { try { return JSON.parse(localStorage.getItem(NAV_KEY)) || {}; } catch (e) { return {}; } }
          function navSave(s) { try { localStorage.setItem(NAV_KEY, JSON.stringify(s)); } catch (e) {} }
          function navSet(li, open) {
            li.querySelector(':scope > .nav-group').setAttribute('aria-expanded', open ? 'true' : 'false');
            li.querySelector(':scope > ul').hidden = !open;
          }
          function navGroups(nav) {
            return Array.prototype.filter.call(nav.querySelectorAll('li'), function (li) { return li.querySelector(':scope > ul'); });
          }
          function navSyncTool(nav) {
            var tool = nav.querySelector('.nav-tools button'); if (!tool) return;
            var anyClosed = navGroups(nav).some(function (li) { return li.querySelector(':scope > ul').hidden; });
            tool.textContent = anyClosed ? 'Tümünü aç' : 'Tümünü kapat';
            tool.dataset.action = anyClosed ? 'open' : 'close';
          }
          function enhanceNav() {
            var nav = document.querySelector('.sidebar-nav'); if (!nav) return;
            var state = navState(), seq = 0;
            navGroups(nav).forEach(function (li) {
              var ul = li.querySelector(':scope > ul');
              var btn = li.querySelector(':scope > .nav-group');
              if (!btn) {
                var head = li.firstElementChild;                 // <p><strong>…</strong></p> ya da <strong>…</strong>
                if (!head || head === ul) return;
                var label = head.textContent.trim();
                var parent = li.parentElement.closest('li');
                var key = (parent && parent.dataset.navKey ? parent.dataset.navKey + ' / ' : '') + label;
                li.dataset.navKey = key;
                ul.id = 'nav-group-' + (seq++);
                btn = document.createElement('button');
                btn.type = 'button'; btn.className = 'nav-group'; btn.setAttribute('aria-controls', ul.id);
                var l = document.createElement('span'); l.className = 'nav-group-label'; l.textContent = label;
                var c = document.createElement('span'); c.className = 'nav-group-count'; c.textContent = ul.querySelectorAll('a').length;
                c.setAttribute('aria-label', c.textContent + ' sayfa');
                btn.appendChild(l); btn.appendChild(c);
                btn.addEventListener('click', function () {
                  var open = btn.getAttribute('aria-expanded') !== 'true';
                  navSet(li, open);
                  var st = navState(); st[key] = open; navSave(st);
                  navSyncTool(nav);
                });
                li.replaceChild(btn, head);
              }
              var hasActive = !!ul.querySelector('li.active');
              btn.classList.toggle('has-active', hasActive);
              navSet(li, hasActive || state[li.dataset.navKey] === true);
            });
            if (!nav.querySelector('.nav-tools')) {
              var tools = document.createElement('div'); tools.className = 'nav-tools';
              var tool = document.createElement('button'); tool.type = 'button';
              tool.addEventListener('click', function () {
                var open = tool.dataset.action === 'open', st = {};
                navGroups(nav).forEach(function (li) { navSet(li, open); st[li.dataset.navKey] = open; });
                navSave(st); navSyncTool(nav);
              });
              tools.appendChild(tool); nav.insertBefore(tools, nav.firstChild);
            }
            navSyncTool(nav);
            var act = nav.querySelector('li.active > a');
            if (act) { try { act.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
          }
          // 1) Ders başlığı: "Ders N — Başlık" → büyük numara + başlık
          hook.afterEach(function (html, next) {
            var m = html.match(/<h1 id="([^"]+)"[^>]*>([\s\S]*?)<\/h1>/);
            if (m) {
              var plain = m[2].replace(/<[^>]+>/g, '');
              var t = plain.match(/^(?:Ders|Lecture)\s+(\d+)\s*[—–-]\s*([\s\S]*)$/);
              if (t) {
                html = html.replace(m[0],
                  '<header class="lec-head"><div class="lec-num">' + String(t[1]).padStart(2, '0') + '</div>' +
                  '<div><div class="lec-kicker">Ders ' + t[1] + '</div><h1 id="' + m[1] + '">' + t[2] + '</h1></div></header>');
              }
            }
            next(html);
          });
          // 2) Sayfa içi başlıklar (sağ sütun) + onay kutularını aç + dış bağlantılar yeni sekme
          hook.doneEach(function () {
            enhanceNav();
            document.querySelectorAll('.task-list-item input[type=checkbox]').forEach(function (c) { c.disabled = false; });
            document.querySelectorAll('.markdown-section a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
            var old = document.querySelector('.page-toc'); if (old) old.remove();
            var hs = Array.prototype.slice.call(document.querySelectorAll('.markdown-section h2'));
            if (hs.length < 3) return;
            var toc = document.createElement('nav'); toc.className = 'page-toc';
            var title = document.createElement('div'); title.className = 'page-toc-title'; title.textContent = 'Bu sayfada'; toc.appendChild(title);
            var ul = document.createElement('ul');
            hs.forEach(function (h) {
              var a = document.createElement('a'); a.href = '#' + vm.route.path + '?id=' + h.id;
              a.textContent = h.textContent.replace(/^\d+\.\s*/, '').replace(/\s*\(.*?\)\s*$/, '');
              var li = document.createElement('li'); li.appendChild(a); ul.appendChild(li);
            });
            toc.appendChild(ul); document.querySelector('.content').appendChild(toc);
            // aktif başlık takibi
            var links = ul.querySelectorAll('a');
            var obs = new IntersectionObserver(function (entries) {
              entries.forEach(function (e) { if (e.isIntersecting) { links.forEach(function (l) { l.classList.remove('is-active'); }); var i = hs.indexOf(e.target); if (links[i]) links[i].classList.add('is-active'); } });
            }, { rootMargin: '-10% 0px -80% 0px' });
            hs.forEach(function (h) { obs.observe(h); });
          });
        }
      ]
    }
  </script>
  <script src="assets/vendor/docsify.min.js"></script>
  <script src="assets/vendor/search.min.js"></script>
  <script src="assets/vendor/docsify-copy-code.min.js"></script>
  <script src="assets/vendor/docsify-pagination.min.js"></script>
  <script src="assets/vendor/prism/prism-python.min.js"></script>
  <script src="assets/vendor/prism/prism-bash.min.js"></script>
  <script src="assets/vendor/prism/prism-yaml.min.js"></script>
  <script src="assets/vendor/prism/prism-json.min.js"></script>
  <script src="assets/vendor/prism/prism-markdown.min.js"></script>
</body>
</html>
