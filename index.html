<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VLA Thesis Journal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Learning and VLA — MSc thesis journal (English; Turkish spatial-command research)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css?v=6">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'VLA Thesis Journal',
      repo: '',
      homepage: 'home.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      relativePath: true,
      auto2top: true,
      notFoundPage: true,
      // on mobile the fixed top bar (56px) must not cover headings: leave a margin when scrolling to ?id=
      topMargin: (window.matchMedia && window.matchMedia('(max-width: 860px)').matches) ? 64 : 0,
      requestHeaders: { 'cache-control': 'no-cache' },
      search: { placeholder: 'Search lectures', noData: 'No results', paths: 'auto', depth: 3 },
      copyCode: { buttonText: 'Copy', successText: 'Copied', errorText: 'Error' },
      pagination: { previousText: 'Previous', nextText: 'Next', crossChapter: true, crossChapterText: true },
      plugins: [
        function (hook, vm) {
          // 0) Sidebar: collapsible groups. Open/closed preference is kept in localStorage;
          //    the group of the current page opens automatically on every navigation.
          var NAV_KEY = 'vla-nav-v1';
          function navState() { try { return JSON.parse(localStorage.getItem(NAV_KEY)) || {}; } catch (e) { return {}; } }
          function navSave(s) { try { localStorage.setItem(NAV_KEY, JSON.stringify(s)); } catch (e) {} }
          function navSet(li, open) {
            li.querySelector(':scope > .nav-group').setAttribute('aria-expanded', open ? 'true' : 'false');
            li.querySelector(':scope > ul').hidden = !open;
          }
          function navGroups(nav) {
            return Array.prototype.filter.call(nav.querySelectorAll('li'), function (li) { return li.querySelector(':scope > ul'); });
          }
          function navSyncTool(nav) {
            var tool = nav.querySelector('.nav-tools button'); if (!tool) return;
            var anyClosed = navGroups(nav).some(function (li) { return li.querySelector(':scope > ul').hidden; });
            tool.textContent = anyClosed ? 'Expand all' : 'Collapse all';
            tool.dataset.action = anyClosed ? 'open' : 'close';
          }
          function enhanceNav() {
            var nav = document.querySelector('.sidebar-nav'); if (!nav) return;
            var state = navState(), seq = 0;
            navGroups(nav).forEach(function (li) {
              var ul = li.querySelector(':scope > ul');
              var btn = li.querySelector(':scope > .nav-group');
              if (!btn) {
                var head = li.firstElementChild;                 // <p><strong>…</strong></p> ya da <strong>…</strong>
                if (!head || head === ul) return;
                var label = head.textContent.trim();
                var parent = li.parentElement.closest('li');
                var key = (parent && parent.dataset.navKey ? parent.dataset.navKey + ' / ' : '') + label;
                li.dataset.navKey = key;
                ul.id = 'nav-group-' + (seq++);
                btn = document.createElement('button');
                btn.type = 'button'; btn.className = 'nav-group'; btn.setAttribute('aria-controls', ul.id);
                var l = document.createElement('span'); l.className = 'nav-group-label'; l.textContent = label;
                var c = document.createElement('span'); c.className = 'nav-group-count'; c.textContent = ul.querySelectorAll('a').length;
                c.setAttribute('aria-label', c.textContent + ' sayfa');
                btn.appendChild(l); btn.appendChild(c);
                btn.addEventListener('click', function () {
                  var open = btn.getAttribute('aria-expanded') !== 'true';
                  navSet(li, open);
                  var st = navState(); st[key] = open; navSave(st);
                  navSyncTool(nav);
                });
                li.replaceChild(btn, head);
              }
              var hasActive = !!ul.querySelector('li.active');
              btn.classList.toggle('has-active', hasActive);
              navSet(li, hasActive || state[li.dataset.navKey] === true);
            });
            if (!nav.querySelector('.nav-tools')) {
              var tools = document.createElement('div'); tools.className = 'nav-tools';
              var tool = document.createElement('button'); tool.type = 'button';
              tool.addEventListener('click', function () {
                var open = tool.dataset.action === 'open', st = {};
                navGroups(nav).forEach(function (li) { navSet(li, open); st[li.dataset.navKey] = open; });
                navSave(st); navSyncTool(nav);
              });
              tools.appendChild(tool); nav.insertBefore(tools, nav.firstChild);
            }
            navSyncTool(nav);
            revealActive(false);
          }
          // Bring the active link into view by scrolling the sidebar itself (not the page).
          function revealActive(center) {
            var sb = document.querySelector('.sidebar');
            var act = sb && sb.querySelector('.sidebar-nav li.active > a');
            if (!act) return;
            var s = sb.getBoundingClientRect(), a = act.getBoundingClientRect();
            if (!center && a.top >= s.top + 8 && a.bottom <= s.bottom - 8) return;
            sb.scrollTop += (a.top - s.top) - (center ? (s.height - a.height) / 2 : 24);
          }

          // 0b) Menu open/close — replaces Docsify's own toggle behaviour.
          //   Why: if the page loads at ≤600px width, Docsify 4 attaches a click listener to body and,
          //   while body.close is set, closes the menu on ANY tap (including group headers, "Expand all", the search box);
          //   moreover on mobile the "close" class means "open", and between 600–860px this
          //   behaviour does not exist at all. We never use the "close" class here (so that listener is inert):
          //   narrow screens: body.nav-open = menu open; wide screens: body.nav-collapsed = menu hidden.
          var NARROW = window.matchMedia('(max-width: 860px)');
          function navIsOpen() {
            return NARROW.matches ? document.body.classList.contains('nav-open')
                                  : !document.body.classList.contains('nav-collapsed');
          }
          function navOpen(open) {
            var b = document.body;
            if (NARROW.matches) { b.classList.toggle('nav-open', open); b.classList.remove('nav-collapsed'); }
            else { b.classList.toggle('nav-collapsed', !open); b.classList.remove('nav-open'); }
            var btn = document.querySelector('button.sidebar-toggle');
            if (btn) { btn.setAttribute('aria-expanded', open ? 'true' : 'false'); btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu'); }
            if (open && NARROW.matches) revealActive(true);
          }
          hook.mounted(function () {
            var old = document.querySelector('button.sidebar-toggle');
            var sb = document.querySelector('.sidebar');
            if (!old || !sb) return;
            var btn = old.cloneNode(true);                     // clone = without Docsify's click listener
            old.parentNode.replaceChild(btn, old);
            sb.id = sb.id || 'site-sidebar';
            btn.setAttribute('aria-controls', sb.id);
            btn.addEventListener('click', function (e) { e.stopPropagation(); navOpen(!navIsOpen()); });
            // mobile top bar + backdrop
            var bar = document.createElement('div'); bar.className = 'm-bar';
            var t = document.createElement('a'); t.className = 'm-title'; t.href = '#/'; t.textContent = window.$docsify.name;
            bar.appendChild(t);
            var veil = document.createElement('div'); veil.className = 'nav-backdrop'; veil.setAttribute('aria-hidden', 'true');
            veil.addEventListener('click', function () { navOpen(false); });
            sb.parentNode.insertBefore(veil, sb);
            sb.parentNode.insertBefore(bar, veil);
            // narrow screens: tapping a page link navigates and closes; group headers do not close the menu
            sb.addEventListener('click', function (e) {
              var a = e.target.closest && e.target.closest('a[href]');
              if (a && NARROW.matches && navIsOpen()) navOpen(false);
            });
            document.addEventListener('keydown', function (e) {
              if (e.key === 'Escape' && NARROW.matches && navIsOpen()) { navOpen(false); btn.focus(); }
            });
            function onMq() {
              document.body.classList.remove('nav-open', 'nav-collapsed');
              vm.config.topMargin = NARROW.matches ? 64 : 0;
              navOpen(navIsOpen());
            }
            if (NARROW.addEventListener) NARROW.addEventListener('change', onMq); else if (NARROW.addListener) NARROW.addListener(onMq);
            navOpen(navIsOpen());
          });
          // 1) Lecture title: "Lecture N — Title" → big number + title
          hook.afterEach(function (html, next) {
            var m = html.match(/<h1 id="([^"]+)"[^>]*>([\s\S]*?)<\/h1>/);
            if (m) {
              var plain = m[2].replace(/<[^>]+>/g, '');
              var t = plain.match(/^(?:Ders|Lecture)\s+(\d+)\s*[—–-]\s*([\s\S]*)$/);
              if (t) {
                html = html.replace(m[0],
                  '<header class="lec-head"><div class="lec-num">' + String(t[1]).padStart(2, '0') + '</div>' +
                  '<div><div class="lec-kicker">Lecture ' + t[1] + '</div><h1 id="' + m[1] + '">' + t[2] + '</h1></div></header>');
              }
            }
            // wide tables scroll horizontally inside their own box, not the page
            html = html.replace(/<table(\s[^>]*)?>/g, '<div class="table-wrap"><table$1>').replace(/<\/table>/g, '</table></div>');
            next(html);
          });
          // 2) On-page headings (right column) + enable checkboxes + external links open in a new tab
          hook.doneEach(function () {
            enhanceNav();
            document.querySelectorAll('.task-list-item input[type=checkbox]').forEach(function (c) { c.disabled = false; });
            document.querySelectorAll('.markdown-section a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
            var old = document.querySelector('.page-toc'); if (old) old.remove();
            var hs = Array.prototype.slice.call(document.querySelectorAll('.markdown-section h2'));
            if (hs.length < 3) return;
            var toc = document.createElement('nav'); toc.className = 'page-toc';
            var title = document.createElement('div'); title.className = 'page-toc-title'; title.textContent = 'Bu sayfada'; toc.appendChild(title);
            var ul = document.createElement('ul');
            hs.forEach(function (h) {
              var a = document.createElement('a'); a.href = '#' + vm.route.path + '?id=' + h.id;
              a.textContent = h.textContent.replace(/^\d+\.\s*/, '').replace(/\s*\(.*?\)\s*$/, '');
              var li = document.createElement('li'); li.appendChild(a); ul.appendChild(li);
            });
            toc.appendChild(ul); document.querySelector('.content').appendChild(toc);
            // active heading tracking
            var links = ul.querySelectorAll('a');
            var obs = new IntersectionObserver(function (entries) {
              entries.forEach(function (e) { if (e.isIntersecting) { links.forEach(function (l) { l.classList.remove('is-active'); }); var i = hs.indexOf(e.target); if (links[i]) links[i].classList.add('is-active'); } });
            }, { rootMargin: '-10% 0px -80% 0px' });
            hs.forEach(function (h) { obs.observe(h); });
          });
        }
      ]
    }
  </script>
  <script src="assets/vendor/docsify.min.js"></script>
  <script src="assets/vendor/search.min.js"></script>
  <script src="assets/vendor/docsify-copy-code.min.js"></script>
  <script src="assets/vendor/docsify-pagination.min.js"></script>
  <script src="assets/vendor/prism/prism-python.min.js"></script>
  <script src="assets/vendor/prism/prism-bash.min.js"></script>
  <script src="assets/vendor/prism/prism-yaml.min.js"></script>
  <script src="assets/vendor/prism/prism-json.min.js"></script>
  <script src="assets/vendor/prism/prism-markdown.min.js"></script>
</body>
</html>
