<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>VLA Tez Günlüğü</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Robot Learning ve VLA — yüksek lisans tez günlüğü (Türkçe)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'VLA Tez Günlüğü',
      repo: '',
      homepage: 'home.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      relativePath: true,
      auto2top: true,
      notFoundPage: true,
      search: { placeholder: 'Derslerde ara', noData: 'Sonuç yok', paths: 'auto', depth: 3 },
      copyCode: { buttonText: 'Kopyala', successText: 'Kopyalandı', errorText: 'Hata' },
      pagination: { previousText: 'Önceki', nextText: 'Sonraki', crossChapter: true, crossChapterText: true },
      plugins: [
        function (hook, vm) {
          // 1) Ders başlığı: "Ders N — Başlık" → büyük numara + başlık
          hook.afterEach(function (html, next) {
            var m = html.match(/<h1 id="([^"]+)"[^>]*>([\s\S]*?)<\/h1>/);
            if (m) {
              var plain = m[2].replace(/<[^>]+>/g, '');
              var t = plain.match(/^(?:Ders|Lecture)\s+(\d+)\s*[—–-]\s*([\s\S]*)$/);
              if (t) {
                html = html.replace(m[0],
                  '<header class="lec-head"><div class="lec-num">' + String(t[1]).padStart(2, '0') + '</div>' +
                  '<div><div class="lec-kicker">Ders ' + t[1] + '</div><h1 id="' + m[1] + '">' + t[2] + '</h1></div></header>');
              }
            }
            next(html);
          });
          // 2) Sayfa içi başlıklar (sağ sütun) + onay kutularını aç + dış bağlantılar yeni sekme
          hook.doneEach(function () {
            document.querySelectorAll('.task-list-item input[type=checkbox]').forEach(function (c) { c.disabled = false; });
            document.querySelectorAll('.markdown-section a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
            var old = document.querySelector('.page-toc'); if (old) old.remove();
            var hs = Array.prototype.slice.call(document.querySelectorAll('.markdown-section h2'));
            if (hs.length < 3) return;
            var toc = document.createElement('nav'); toc.className = 'page-toc';
            var title = document.createElement('div'); title.className = 'page-toc-title'; title.textContent = 'Bu sayfada'; toc.appendChild(title);
            var ul = document.createElement('ul');
            hs.forEach(function (h) {
              var a = document.createElement('a'); a.href = '#' + vm.route.path + '?id=' + h.id;
              a.textContent = h.textContent.replace(/^\d+\.\s*/, '').replace(/\s*\(.*?\)\s*$/, '');
              var li = document.createElement('li'); li.appendChild(a); ul.appendChild(li);
            });
            toc.appendChild(ul); document.querySelector('.content').appendChild(toc);
            // aktif başlık takibi
            var links = ul.querySelectorAll('a');
            var obs = new IntersectionObserver(function (entries) {
              entries.forEach(function (e) { if (e.isIntersecting) { links.forEach(function (l) { l.classList.remove('is-active'); }); var i = hs.indexOf(e.target); if (links[i]) links[i].classList.add('is-active'); } });
            }, { rootMargin: '-10% 0px -80% 0px' });
            hs.forEach(function (h) { obs.observe(h); });
          });
        }
      ]
    }
  </script>
  <script src="assets/vendor/docsify.min.js"></script>
  <script src="assets/vendor/search.min.js"></script>
  <script src="assets/vendor/docsify-copy-code.min.js"></script>
  <script src="assets/vendor/docsify-pagination.min.js"></script>
  <script src="assets/vendor/prism/prism-python.min.js"></script>
  <script src="assets/vendor/prism/prism-bash.min.js"></script>
  <script src="assets/vendor/prism/prism-yaml.min.js"></script>
  <script src="assets/vendor/prism/prism-json.min.js"></script>
  <script src="assets/vendor/prism/prism-markdown.min.js"></script>
</body>
</html>
